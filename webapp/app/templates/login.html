{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="card narrow">
  <div class="auth-mark">
    <svg width="46" height="46" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="24" height="24" rx="6" fill="var(--accent)"/>
      <path d="M6 18.5V8.5C6 7.67157 6.67157 7 7.5 7H14.5L20 12.5V18.5C20 19.3284 19.3284 20 18.5 20H7.5C6.67157 20 6 19.3284 6 18.5Z" stroke="var(--accent-ink)" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M14.5 7V11.5C14.5 12.0523 14.9477 12.5 15.5 12.5H20" stroke="var(--accent-ink)" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M9 15H14" stroke="var(--accent-ink)" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </div>
  <h1>С возвращением</h1>
  <p class="lede">Учётные записи выдаёт администратор.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label>Логин</label>
    <input type="text" name="username" value="{{ username or '' }}" required autofocus autocomplete="username">
    <label>Пароль</label>
    <input type="password" name="password" required autocomplete="current-password">
    <div class="row" style="margin-top:20px">
      <button class="primary" type="submit" style="width:100%; justify-content:center">Войти</button>
    </div>
  </form>
</div>
{% endblock %}
