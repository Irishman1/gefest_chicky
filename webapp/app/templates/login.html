{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block body %}
<div class="auth">
  <div class="auth-box">
    <div class="card">
      <div class="auth-mark">{% with mark_size = 26 %}{% include "_mark.svg" %}{% endwith %}</div>
      <h1>Вход</h1>
      <p class="lede">Учётные записи выдаёт администратор.</p>

      {% if error %}
        <div class="error" style="margin-bottom:16px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2v.01"/></svg>
          <span>{{ error }}</span>
        </div>
      {% endif %}

      <form method="post" action="/login">
        <div class="f">
          <label for="u">Логин</label>
          <input id="u" type="text" name="username" value="{{ username or '' }}" required autofocus autocomplete="username">
        </div>
        <div class="f">
          <label for="p">Пароль</label>
          <input id="p" type="password" name="password" required autocomplete="current-password">
        </div>
        <button class="primary btn-block" type="submit">Войти</button>
      </form>
    </div>
    <div class="auth-foot">Есть код приглашения? <a href="/register">Создать аккаунт</a></div>
  </div>
</div>
{% endblock %}
