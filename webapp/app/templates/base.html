<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Нарезка планировок{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
<header class="top">
  <a class="brand" href="/projects">Нарезка планировок</a>
  <nav>
    {% if user %}
      <span class="muted">{{ user["username"] }}</span>
      {% if user["is_admin"] %}<a href="/admin">Админка</a>{% endif %}
      <a href="/logout">Выйти</a>
    {% endif %}
    <button class="theme" id="theme-toggle" type="button" title="Светлая / тёмная тема">◐</button>
  </nav>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
