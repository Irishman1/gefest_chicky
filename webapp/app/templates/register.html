{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block body %}
<div class="auth">
  <div class="auth-box">
    <div class="card">
      <div class="auth-mark">{% with mark_size = 26 %}{% include "_mark.svg" %}{% endwith %}</div>
      <h1>Создать аккаунт</h1>
      <p class="lede">Нужен код приглашения от администратора.</p>

      {% if error %}
        <div class="error" style="margin-bottom:16px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2v.01"/></svg>
          <span>{{ error }}</span>
        </div>
      {% endif %}

      <form method="post" action="/register">
        <div class="f">
          <label for="c">Код приглашения</label>
          <input id="c" type="text" name="code" value="{{ code or '' }}" required autocomplete="off">
        </div>
        <div class="f">
          <label for="u">Логин</label>
          <input id="u" type="text" name="username" value="{{ username or '' }}" required
                 pattern="[a-zA-Z0-9_.\-]{3,32}" autocomplete="username">
        </div>
        <div class="f">
          <label for="p">Пароль <span class="muted">— от 8 символов</span></label>
          <input id="p" type="password" name="password" required autocomplete="new-password">
        </div>
        <div class="f">
          <label for="p2">Пароль ещё раз</label>
          <input id="p2" type="password" name="password2" required autocomplete="new-password">
        </div>
        <button class="primary btn-block" type="submit">Создать аккаунт</button>
      </form>
    </div>
    <div class="auth-foot">Уже есть аккаунт? <a href="/login">Войти</a></div>
  </div>
</div>
{% endblock %}
