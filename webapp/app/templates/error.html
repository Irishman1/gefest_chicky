{% extends "base.html" %}
{% block title %}Ошибка {{ code }}{% endblock %}
{% block body %}
<div class="auth">
  <div class="auth-box">
    <div class="card">
      <div class="auth-mark" style="color:var(--err)">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2v.01"/></svg>
      </div>
      <h1>Ошибка {{ code }}</h1>
      <p class="lede">{{ detail }}</p>
      <a class="btn btn-block" href="/projects" style="margin-top:20px">К проектам</a>
    </div>
  </div>
</div>
{% endblock %}
